<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Opdracht 2</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<audio id="clickSound" src="assets/audio/relais.mp3" preload="auto"></audio>

<section id="countdown" class="screen active">
  <div class="count-wrap">
    <div id="taskTitle" class="task">Opdracht 2</div>
    <div id="countNumber" class="count">3</div>
  </div>
</section>

<section id="quiz" class="screen">
  <main class="app">
    <div class="header">
      <div id="brand" class="brand"></div>
      <div id="counter" class="counter"></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <article class="card"><div id="content"></div></article>
    <div class="nav">
      <button id="prev" class="secondary">← Vorige</button>
      <button id="next" class="primary">Volgende →</button>
    </div>
    <p class="note">Noteer jullie antwoord op de antwoordkaart.</p>
    <p id="version" class="version"></p>
  </main>
</section>

<section id="finish" class="screen">
  <div class="finish-box">
    <div class="kicker">Opdracht voltooid</div>
    <h1>Controleer jullie antwoordkaart.</h1>
    <button id="decoder" class="primary full">Start Decoder →</button>
    <button id="back" class="secondary full">← Terug naar vraag 16</button>
    <p id="versionEnd" class="version"></p>
  </div>
</section>

<script src="opdrachten/opdracht02.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
