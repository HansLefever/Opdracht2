<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050805">
<title>De Mol – Opdracht 2</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="app">
  <section id="intro" class="screen active">
    <div class="panel countdown-panel">
      <div class="eyebrow">De Mol</div>
      <h1>Opdracht 2</h1>
      <div id="countdown" class="countdown">3</div>
      <p id="version" class="version">Versie 2.1</p>
    </div>
  </section>

  <section id="quiz" class="screen">
    <div class="header">
      <div id="brand" class="brand"></div>
      <div id="counter" class="counter"></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <article class="card"><div id="content"></div></article>
    <div class="nav">
      <button id="prev" class="secondary">← Vorige</button>
      <button id="next" class="primary">Volgende →</button>
    </div>
    <p class="note">Noteer jullie antwoord op de antwoordkaart.</p>
  </section>

  <section id="finish" class="screen">
    <div class="panel">
      <div class="eyebrow">Opdracht voltooid</div>
      <h1>Alle antwoorden genoteerd?</h1>
      <p class="lead">Controleer jullie antwoordkaart en ga daarna verder naar de Decoder.</p>
      <button id="decoderBtn" class="primary full">Start Decoder →</button>
      <button id="backBtn" class="secondary full">← Terug naar vraag 16</button>
      <p class="version">Versie 2.1</p>
    </div>
  </section>
</main>
<script>
  const teamKey=(new URLSearchParams(location.search).get('team')||'A').toUpperCase();
  const safeTeam=['A','B','C'].includes(teamKey)?teamKey:'A';
  document.write('<script src="data/instellingen.js"><\/script>');
  document.write('<script src="data/team'+safeTeam+'.js"><\/script>');
</script>
<script src="assets/js/app.js"></script>
</body>
</html>
